name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome
        run: npm run lint
      - name: TypeScript declarations
        run: npm run types
      - name: Stock Node tests and coverage
        run: npm test
      - name: Package contents
        run: npm pack --dry-run --ignore-scripts

  quic:
    name: HTTP/3 (QUIC-enabled Node)
    needs: quality
    runs-on: ubuntu-latest
    env:
      # Cache keys are repository-wide, not workflow-specific. Bump this only
      # when we intentionally want to rebuild from the latest Node main.
      QUIC_BINARY_CACHE_VERSION: v2
    steps:
      - uses: actions/checkout@v6
        with:
          path: blockhaus
      - name: Restore QUIC-enabled Node binary
        id: quic-binary
        uses: actions/cache@v6
        with:
          path: .cache/node-quic/node
          key: node-main-quic-binary-${{ env.QUIC_BINARY_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Check out Node main
        id: node-checkout
        if: steps.quic-binary.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: nodejs/node
          ref: main
          path: node
      - name: Restore incremental Node build cache
        if: steps.quic-binary.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: node/out
          key: node-main-quic-build-${{ env.QUIC_BINARY_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-checkout.outputs.commit }}
          restore-keys: |
            node-main-quic-build-${{ env.QUIC_BINARY_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
            node-quic-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version-file: blockhaus/.nvmrc
          cache: npm
          cache-dependency-path: blockhaus/package-lock.json
      - name: Install project dependencies
        working-directory: blockhaus
        run: npm ci
      - name: Install Node build dependencies
        if: steps.quic-binary.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Configure QUIC-enabled Node
        if: steps.quic-binary.outputs.cache-hit != 'true'
        working-directory: node
        run: ./configure --ninja --experimental-quic
      - name: Build QUIC-enabled Node
        if: steps.quic-binary.outputs.cache-hit != 'true'
        working-directory: node
        run: |
          ninja -C out/Release -j 4
          mkdir -p ../.cache/node-quic
          cp out/Release/node ../.cache/node-quic/node
      - name: Run complete suite with HTTP/3 enabled
        run: ./.cache/node-quic/node --experimental-quic --test --test-concurrency=1 blockhaus/test/*.test.js

  benchmark:
    name: Performance benchmarks
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install benchmark dependencies
        run: npm ci --prefix benchmark
      - name: Run comparative benchmarks
        run: npm run benchmark
        env:
          # Hosted runners have a distinct performance profile, so compare
          # against their own conservative baseline and fail on regressions.
          BENCHMARK_BASELINE: "baseline-ci.json"
          BENCHMARK_BASELINE_METRIC: "blockhaus-rps"
          BENCHMARK_MIN_RELATIVE: "0"
          BENCHMARK_MAX_REGRESSION: "0.20"
