name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biome
        run: npm run lint
      - name: TypeScript declarations
        run: npm run types
      - name: Stock Node tests and coverage
        run: npm test
      - name: Package contents
        run: npm pack --dry-run --ignore-scripts

  quic:
    name: HTTP/3 (QUIC-enabled Node)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          path: dodici
      - uses: actions/checkout@v6
        with:
          repository: nodejs/node
          ref: main
          path: node
      - name: Resolve Node revision
        id: node-revision
        working-directory: node
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore Node build cache
        uses: actions/cache@v4
        with:
          path: node/out
          key: node-quic-${{ runner.os }}-${{ steps.node-revision.outputs.sha }}
          restore-keys: |
            node-quic-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version-file: dodici/.nvmrc
          cache: npm
          cache-dependency-path: dodici/package-lock.json
      - name: Install project dependencies
        working-directory: dodici
        run: npm ci
      - name: Install Node build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Configure QUIC-enabled Node
        working-directory: node
        run: ./configure --ninja --experimental-quic
      - name: Build QUIC-enabled Node
        working-directory: node
        run: ninja -C out/Release -j 4
      - name: Run complete suite with HTTP/3 enabled
        run: ./node/out/Release/node --experimental-quic --test --test-concurrency=1 dodici/test/*.test.js

  benchmark:
    name: Performance benchmarks
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install benchmark dependencies
        run: npm ci --prefix benchmark
      - name: Run comparative benchmarks
        run: npm run benchmark
        env:
          # Hosted runners have a distinct performance profile, so compare
          # against their own conservative baseline and fail on regressions.
          BENCHMARK_BASELINE: "benchmark/baseline-ci.json"
          BENCHMARK_MIN_RELATIVE: "0"
          BENCHMARK_MAX_REGRESSION: "0.20"
